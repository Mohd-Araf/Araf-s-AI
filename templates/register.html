<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Araf's Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-icon">🤖</div>
      <h2 class="auth-title">Create Account</h2>
      <p class="auth-subtitle">Get started with Araf's Assistant</p>
    </div>

    <div class="alert-box alert-error" id="error-alert"></div>

    <form id="register-form">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" class="form-control" placeholder="e.g. araf123" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" id="email" class="form-control" placeholder="araf@example.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password (min. 6 chars)</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" minlength="6" required>
      </div>

      <button type="submit" class="auth-submit-btn" id="submit-btn">Register</button>
    </form>

    <div class="auth-footer-text">
      Already have an account? <a href="/login/">Sign In</a>
    </div>
  </div>

  <script src="/static/js/auth.js"></script>
  <script>
    if (localStorage.getItem('authToken')) {
      window.location.href = '/';
    }

    const form = document.getElementById('register-form');
    const alertBox = document.getElementById('error-alert');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerText = 'Creating account...';

      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/v1/auth/register/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('authToken', data.token);
          localStorage.setItem('user', JSON.stringify(data.user));
          window.location.href = '/';
        } else {
          let errMsg = 'Registration failed.';
          if (data.username) errMsg = data.username[0];
          else if (data.email) errMsg = data.email[0];
          else if (data.password) errMsg = data.password[0];
          
          alertBox.innerText = errMsg;
          alertBox.style.display = 'block';
        }
      } catch (err) {
        alertBox.innerText = 'Network error. Please try again.';
        alertBox.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Register';
      }
    });
  </script>
</body>
</html>
